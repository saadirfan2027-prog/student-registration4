<!DOCTYPE html>
<html lang="en">
<head> 
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 >Student Registration</h1>
    <img src="me.jpg.png" width="200">
    <form action="thanks.html" method="get">
        <label id="Name">  Name</label>
        <input type="text" name="Name" required placeholder="Name">
        <br><br>
        
    

        <label>Registration Name </label>
        <input type="text" name="Registration" required>
        <br><br>

        <label>Email</label>
        <input type="email" name="email" placeholder="abc@gmail.com" required>
        <br><br>

        <label>Phone</label>
        <input type="tel" name="Phone" placeholder="03xxxxxxxxx" required>
        <br><br>

        <label>Age</label>
        <input type="number" name="age" min="16" max="40" required>
        <br><br>

        <label>DOB</label>
        <input type="date" name="DOB" required>
        <br><br>

        <label>Gender</label>
        <input type="radio" name="Gender" value="Male" required>Male
        <input type="radio" name="Gender" value="Girl" required>Girl
        <br><br>

        <label>Department</label>
        <select name="Department" required>
        <option>Ai</option>
        <option>SE</option>
        <option>CS</option>
        </select>
        <br><br>
        
        <label>Intrests</label>
        <input type="checkbox" name="Intrests" value="Gaming" required>Gaming
        <input type="checkbox" name="Intrests" value="Reading" required>Reading
        <input type="checkbox" name="Intrests" value="Anime" required>Anime
        <br><br>

        <label>Address: </label>
        <textarea name="Address" rows="4" required></textarea>
        <br><br>
        
        <input type="submit" value="send">
    </form>
</body>
</html>
